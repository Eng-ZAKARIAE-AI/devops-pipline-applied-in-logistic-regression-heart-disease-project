name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r logistic-regression-heart-disease/requirements.txt
          pip install pytest

      - name: Train model artifacts
        run: python logistic-regression-heart-disease/src/train.py
        working-directory: logistic-regression-heart-disease

      - name: Run pytest test suite
        run: python -m pytest tests/ -v
        working-directory: logistic-regression-heart-disease

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: logistic-regression-heart-disease
          load: true
          tags: logistic-regression-api:ci

      - name: Verify Docker image builds
        run: docker images | grep logistic-regression-api
